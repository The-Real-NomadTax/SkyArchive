[package]
name = "skyarchive"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Skylander collection manager with Portal of Power support"
license = "MIT"
readme = "README.md"

[features]
default = []
# Portal of Power USB access through the pure-Rust rawusb crate.
usb = ["dep:rawusb"]

[dependencies]
rawusb = { version = "0.1.7", optional = true }
